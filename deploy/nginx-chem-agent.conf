# Nginx 反向代理参考：Chem_Agent（清小搭接入 + 公开网页 / BYOK）
#
# 用法：
#   sudo cp deploy/nginx-chem-agent.conf /etc/nginx/conf.d/chem_agent.conf
#   # 改 server_name 与证书路径（证书可用 certbot 申请）
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点（缺一项就会出现难以定位的现象）：
# 1) proxy_buffering off  —— 网页走 SSE 流式，缓冲会让"逐步输出"变成一次性吐出；
#    上游代码已带 X-Accel-Buffering: no，这里再显式关一次更稳。
# 2) X-Forwarded-For      —— 服务端按它取真实客户端 IP 做限流；不转发则所有用户
#    共享同一配额（都算成 Nginx 的 IP）。
# 3) proxy_read_timeout   —— 难题生成 + LaTeX 编译可达 1~3 分钟，默认 60s 会断开。
# 4) client_max_body_size —— 图片输入（前端限每张 8MB、最多 4 张）。

server {
    listen 80;
    server_name your.host;                 # ← 改成你的域名
    # certbot 会自动补 443 与证书配置；纯 HTTP 调试可先只用这一段
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your.host;                 # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/your.host/fullchain.pem;   # ← 改
    ssl_certificate_key /etc/letsencrypt/live/your.host/privkey.pem;     # ← 改
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 24m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 自定义凭证/对话头（网页 BYOK 用 X-Chem-*）——默认即透传，此处显式声明
        proxy_pass_request_headers on;

        proxy_buffering off;               # ★ SSE 必需
        proxy_cache off;
        proxy_read_timeout    300s;        # ★ 难题生成耗时长
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # 图示附件：文件名随机不可猜测，可长缓存
    location ~ ^/(files|api/session)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        expires 1h;
        add_header Cache-Control "public";
    }
}
